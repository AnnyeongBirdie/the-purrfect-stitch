name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      # A fully-qualified destination (name + OS) is unambiguous on its own —
      # xcodebuild finds and boots the matching simulator itself. An earlier
      # version of this workflow tried to resolve a UDID by grepping `xcrun
      # simctl list devices available` for "iPhone 16", but that list isn't
      # scoped to this scheme's deployment target — it grabbed a device from
      # a different iOS runtime than the one actually available for this
      # scheme (OS 26.2), and xcodebuild rejected the mismatched UDID.
      DESTINATION: platform=iOS Simulator,name=iPhone 16e,OS=26.2
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project DesignerAna.xcodeproj -scheme DesignerAna \
            -destination "$DESTINATION" clean build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild -project DesignerAna.xcodeproj -scheme DesignerAna \
            -destination "$DESTINATION" test \
            CODE_SIGNING_ALLOWED=NO
