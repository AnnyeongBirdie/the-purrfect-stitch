name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 16" | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Build
        run: |
          xcodebuild -project DesignerAna.xcodeproj -scheme DesignerAna \
            -destination "id=$SIMULATOR_UDID" clean build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild -project DesignerAna.xcodeproj -scheme DesignerAna \
            -destination "id=$SIMULATOR_UDID" test \
            CODE_SIGNING_ALLOWED=NO
